<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Voice For You</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="app-container">
    
    <!-- Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab(event, 'love')">Love</button>
        <button class="tab-btn" onclick="openTab(event, 'listen')">Listen</button>
        <button class="tab-btn" onclick="openTab(event, 'answer')">Ask</button>
        <button class="tab-btn" onclick="openTab(event, 'fate')">Fate</button>
    </div>

    <!-- Tab 1: Love (Pink) -->
    <div id="love" class="content-area active">
        <h2>Daily Affirmation ✨</h2>
        <p>Need a reminder of how much I love you? Tap the star.</p>
        <button class="action-btn btn-love" onclick="playAudio('love')">Play</button>
        <div class="status-text" id="status-love"></div>
    </div>

    <!-- Tab 2: Listen (Mint Green - Dropdown) -->
    <div id="listen" class="content-area">
        <h2>Listen to Me 🎧</h2>
        <p>Select a track from the list below:</p>
        
        <!-- The Dropdown Menu -->
        <select id="track-select" class="track-dropdown" onchange="changeTrack()">
            <option value="" disabled selected>Select a track...</option>
            <option value="1_guided_sleep.mp3">1. Guided Sleep</option>
            <option value="2_deep_relaxation.mp3">2. Deep Relaxation</option>
            <option value="3_spice.mp3">3. Spice</option>
        </select>

        <!-- The Audio Player -->
        <div class="audio-wrapper">
            <audio id="listen-player" controls controlsList="nodownload">
                <source src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
        <div class="status-text" id="status-listen"></div>
    </div>

    <!-- Tab 3: Answer (Lavender) -->
    <div id="answer" class="content-area">
        <h2>Book of Answers 🔮</h2>
        <p>Focus on a "Yes or No" question, then tap the button.</p>
        <button class="action-btn btn-answer" onclick="getAnswer()">Ask</button>
        <div id="answer-display" class="answer-box"></div>
    </div>

    <!-- Tab 4: Fate (Blue - Coming Soon) -->
    <div id="fate" class="content-area">
        <h2>Quick Tarot 🌙</h2>
        <div class="coming-soon-box">
            <div class="lock-icon">☁️</div>
            <p class="small-text">I am still reading the stars...</p>
            <p class="small-text" style="font-size: 0.8rem; margin-top:5px;">Check back later!</p>
        </div>
    </div>

</div>

<script src="js/main.js"></script>

</body>
</html>
